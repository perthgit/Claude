<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="Hajde: learn Bosnian from scratch.">
<title>Hajde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout concept: one calm phone-width column (centred on desktop). Learn path and Review are two tabs;
   a lesson or review session takes over the whole column with a progress bar on top and an action dock below.
   Palette comes from the Neretva: river teal, cool limestone neutrals, lily gold used only for progress. */
:root{
  --bg:#EEF2F1;
  --surface:#FFFFFF;
  --ink:#14221F;
  --muted:#586A65;
  --line:#D5DEDB;
  --accent:#17636B;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEDEE;
  --gold:#B8801A;
  --on-gold:#1B1405;
  --good:#2C7A4B;
  --good-soft:#DDF0E4;
  --bad:#B3402D;
  --bad-soft:#F7E0DA;
  --shadow:0 1px 2px rgba(20,34,31,.06),0 8px 24px rgba(20,34,31,.06);
  --font-display:'Literata',Georgia,'Times New Roman',serif;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1514;
    --surface:#142120;
    --ink:#E4EEEB;
    --muted:#94A9A3;
    --line:#233633;
    --accent:#5DBFC4;
    --accent-ink:#06201F;
    --accent-soft:#143638;
    --gold:#E0B04F;
    --on-gold:#1B1405;
    --good:#6CC592;
    --good-soft:#163425;
    --bad:#EE8872;
    --bad-soft:#3A201A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1514;
  --surface:#142120;
  --ink:#E4EEEB;
  --muted:#94A9A3;
  --line:#233633;
  --accent:#5DBFC4;
  --accent-ink:#06201F;
  --accent-soft:#143638;
  --gold:#E0B04F;
  --on-gold:#1B1405;
  --good:#6CC592;
  --good-soft:#163425;
  --bad:#EE8872;
  --bad-soft:#3A201A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;padding-inline:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active:not(:disabled){transform:scale(.985)}
h1,h2,p,ul{margin:0}
.app{max-width:460px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column}
#view{flex:1;display:flex;flex-direction:column;min-width:0}

/* type */
.display{font-family:var(--font-display);font-weight:500;font-size:clamp(2rem,9vw,2.6rem);line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.display.sm{font-size:clamp(1.6rem,7vw,2rem)}
.lead{color:var(--muted);margin-top:.6rem;text-wrap:pretty}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fine{font-size:.8125rem;color:var(--muted);text-wrap:pretty}
.phrase{font-family:var(--font-display);font-weight:500;font-size:clamp(2.1rem,10vw,2.9rem);line-height:1.1;letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.phrase.en-phrase{font-size:clamp(1.5rem,7vw,2rem);font-weight:400}
.resp{font-size:1rem;color:var(--muted);letter-spacing:.02em}
.en{font-size:1.25rem;font-weight:600}
.prompt{font-weight:600;font-size:1.0625rem}
.hint{color:var(--muted);font-size:.9375rem;text-wrap:pretty}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:10px 0;font-weight:600}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:14px 4px}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.25rem;letter-spacing:-.01em}
.streak{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted)}
.streak::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hello{padding-block:18px 6px}
.today{display:grid;gap:8px;margin-block:14px 6px}
.today-row{display:flex;justify-content:space-between;gap:12px;font-size:.875rem;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .4s ease}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-top:14px}
.nudge strong{display:block}
.nudge .btn{min-height:44px;padding-inline:16px;flex:none}
.unit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:26px}
.unit-head h2{font-family:var(--font-display);font-weight:500;font-size:1.75rem;line-height:1.1;letter-spacing:-.01em}
.unit-head p{color:var(--muted);font-size:.9375rem}
.arch{width:112px;height:42px;color:var(--accent);flex:none}
.path{list-style:none;padding:0;margin-top:10px}
.node{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 4px;min-height:72px}
.path li:first-child .node{border-top:0}
.node.current{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow)}
.node-mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.node.done .node-mark{background:var(--accent);color:var(--accent-ink)}
.node.locked{opacity:.6;cursor:default}
.node.locked .node-mark{background:var(--line);color:var(--muted)}
.node-bs{display:block;font-family:var(--font-display);font-size:1.25rem;font-weight:500;line-height:1.2}
.node-en{display:block;font-size:.875rem;color:var(--muted)}
.node-cta{font-size:.875rem;font-weight:600;color:var(--accent)}
.foot{display:grid;gap:12px;padding-block:28px 20px}
.foot .link{justify-self:start;font-size:.8125rem;color:var(--muted);font-weight:500}

/* tabs */
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:0;background:none;color:var(--muted);font-size:.75rem;font-weight:600;border-radius:12px}
.tab[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:.6875rem;font-weight:700;display:grid;place-items:center}

/* lesson shell */
.lesson{display:flex;flex-direction:column;flex:1;min-height:0}
.lesson-top{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.stage{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:12px 24px}
.big{display:grid;gap:12px;justify-items:start}
.center{justify-items:center;text-align:center}
.play-row{display:flex;gap:8px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;min-height:44px}
.play.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.note{color:var(--muted);padding-top:12px;border-top:1px solid var(--line);text-wrap:pretty}
.reveal{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.reveal .phrase{font-size:clamp(1.75rem,8vw,2.3rem)}

.sounds{list-style:none;padding:0;display:grid;gap:0}
.sounds li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sounds li:first-child{border-top:0}
.ltr{font-family:var(--font-display);font-size:2rem;font-weight:500;text-align:center;color:var(--accent)}
.snd{font-size:.9375rem}
.ex{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:6px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.875rem}
.ex em{font-style:normal;font-family:var(--font-display);font-size:1rem}
.ex span{color:var(--muted)}

.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:56px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1.0625rem}
.opt.bs{font-family:var(--font-display);font-size:1.25rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.answer{min-height:72px;border-radius:14px;border:1.5px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answer.ok{border-color:var(--good);border-style:solid;background:var(--good-soft)}
.answer.no{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--font-display);font-size:1.15rem;padding:10px 14px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.tile.in{border-color:var(--accent)}
.tile.used{opacity:0;pointer-events:none}

.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.col{display:grid;gap:10px;align-content:start}
.mt{min-height:56px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-family:var(--font-display);font-size:1.0625rem;overflow-wrap:anywhere}
.mt.en{font-family:var(--font-ui);font-size:.9375rem}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.matched{border-color:var(--good);background:var(--good-soft);opacity:.75}
.mt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.dock{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;gap:12px}
.dock.ok{background:var(--good-soft)}
.dock.no{background:var(--bad-soft)}
.dock-hint{color:var(--muted);text-align:center;font-size:.9375rem;padding-block:14px}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb strong{display:block;font-size:1.0625rem}
.fb span.d{color:var(--muted);font-size:.9375rem}
.fb-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.dock.ok .fb-ic{background:var(--good)}
.dock.no .fb-ic{background:var(--bad)}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.stack{flex-direction:column;gap:0;padding:8px 12px;line-height:1.25}
.btn.stack small{font-weight:500;font-size:.75rem;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* result and review list */
.result{display:flex;flex-direction:column;gap:18px;padding-block:32px 24px;flex:1}
.stats{display:flex;gap:24px}
.stat strong{display:block;font-family:var(--font-display);font-size:1.75rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8125rem;color:var(--muted)}
.plist{list-style:none;padding:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow b{font-family:var(--font-display);font-weight:500;font-size:1.125rem;display:block}
.prow small{display:block;color:var(--muted);font-size:.875rem}
.pips{display:flex;gap:3px;justify-content:flex-end}
.pip{width:14px;height:6px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--accent)}
.sec{display:grid;gap:6px;padding-block:20px 6px}
.sec h2{font-family:var(--font-display);font-weight:500;font-size:1.5rem}
.actions{display:grid;gap:10px;margin-top:auto}

/* speak: repeat-after-me session */
.say-stage{justify-content:center}
.turn-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.turn-card.turn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9375rem;color:var(--muted);letter-spacing:.01em}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.turn{color:var(--accent)}
.status.turn::before{background:var(--accent)}
.gapbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gapbar>span{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;animation:gapfill var(--gap,3s) linear forwards}
@keyframes gapfill{to{width:100%}}
.gapbar.idle>span{animation:none;width:0}
.set-count{font-variant-numeric:tabular-nums}
.opt-wrap{margin-block:4px 14px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:64px}
.opt-row strong{display:block;font-weight:700}
.opt-row small{display:block;color:var(--muted);font-size:.8125rem;margin-top:2px;text-wrap:pretty}
.switch{flex:none;width:50px;height:30px;border-radius:99px;background:var(--bg);border:1.5px solid var(--muted);position:relative;transition:background .2s,border-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.opt-row[aria-checked="true"] .switch{background:var(--accent);border-color:var(--accent)}
.opt-row[aria-checked="true"] .switch::after{transform:translateX(20px);background:var(--accent-ink)}
.rec-line{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.875rem;color:var(--bad)}
.rec-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.lvl{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.lvl>i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit}
.mini-h{font-family:var(--font-display);font-weight:500;font-size:1.25rem;margin-bottom:6px}
.hear{list-style:none;padding:0;margin:0}
.hear li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hear li:first-child{border-top:0}
.hear-bs{font-family:var(--font-display);font-size:1.0625rem;min-width:0;overflow-wrap:anywhere}
.hear-btns{display:flex;gap:8px;flex:none}
.hear .play{padding:8px 14px}
@media (prefers-reduced-motion: no-preference){ .rec-dot{animation:recpulse 1.4s ease-in-out infinite} }
@keyframes recpulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .gapbar{display:none} }

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;align-items:end;z-index:10}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:460px;margin-inline:auto;width:100%;display:grid;gap:12px}
.sheet h2{font-family:var(--font-display);font-weight:500;font-size:1.375rem}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="app" id="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Main sections"></nav>
</div>

<script>
(function(){
'use strict';

/* ---------- content: Units 1 to 10, standard Bosnian (ijekavian, Latin script) ---------- */
var LESSONS=[
  {id:'l1',bs:'Zdravo!',en:'Hello and goodbye',mins:5,
   tip:{title:'The sounds of Bosnian',lead:'Bosnian is spelled the way it sounds, and every letter is pronounced. These six are the ones to learn first.',rows:[
     {l:'j',s:'like “y” in yes',w:'jutro',g:'morning'},
     {l:'č',s:'like “ch” in church',w:'čaj',g:'tea'},
     {l:'ć',s:'a softer “ch”, tongue pushed forward',w:'ćao',g:'hi'},
     {l:'š',s:'like “sh” in ship',w:'škola',g:'school'},
     {l:'ž',s:'like the “s” in measure',w:'žena',g:'woman'},
     {l:'đ',s:'a soft “j”, as in adjust',w:'doviđenja',g:'goodbye'}]},
   items:[
     {id:'zdravo',bs:'Zdravo',en:'Hello',say:'ZDRAH-vo',note:'The all-purpose hello. Fine with anyone.'},
     {id:'dobar-dan',bs:'Dobar dan',en:'Good day',say:'DO-bar dahn',note:'Heard from late morning until evening.'},
     {id:'dobro-jutro',bs:'Dobro jutro',en:'Good morning',say:'DO-bro YOO-tro',note:'Used until about mid-morning.'},
     {id:'cao',bs:'Ćao',en:'Hi / bye',say:'chow',note:'Casual, with friends and family. Works for both hello and goodbye.'},
     {id:'hvala',bs:'Hvala',en:'Thank you',say:'HVAH-la',note:'Add “lijepo” for “thank you very much”.'},
     {id:'molim',bs:'Molim',en:'Please / you’re welcome',say:'MO-leem',note:'One word that covers both please and you’re welcome.'},
     {id:'dovidjenja',bs:'Doviđenja',en:'Goodbye',say:'do-VEE-jen-ya',note:'Literally “until we meet again”.'}
   ]},
  {id:'l2',bs:'Kako si?',en:'How are you?',mins:4,
   items:[
     {id:'kako-si',bs:'Kako si?',en:'How are you?',say:'KAH-ko see',note:'To friends and family. To someone older, or formally, say “Kako ste?”.'},
     {id:'dobro-sam',bs:'Dobro sam.',en:'I’m well.',say:'DO-bro sahm',note:'Literally “well I am”.'},
     {id:'nije-lose',bs:'Nije loše.',en:'Not bad.',say:'NEE-yeh LO-sheh',note:'A very common, relaxed answer.'},
     {id:'a-ti',bs:'A ti?',en:'And you?',say:'ah TEE',note:'Short and useful. Keeps the conversation going.'},
     {id:'hvala-dobro-sam',bs:'Hvala, dobro sam.',en:'Thanks, I’m well.',say:'HVAH-la, DO-bro sahm',note:'The polite full answer.'}
   ]},
  {id:'l3',bs:'Kako se zoveš?',en:'Introductions',mins:4,
   items:[
     {id:'kako-se-zoves',bs:'Kako se zoveš?',en:'What’s your name?',say:'KAH-ko seh ZO-vesh',note:'Literally “how do you call yourself?”.'},
     {id:'zovem-se-ana',bs:'Zovem se Ana.',en:'My name is Ana.',say:'ZO-vem seh AH-na',note:'Swap in your own name.'},
     {id:'drago-mi-je',bs:'Drago mi je.',en:'Nice to meet you.',say:'DRAH-go mee yeh',note:'Literally “it is dear to me”.'},
     {id:'ja-sam-marko',bs:'Ja sam Marko.',en:'I am Marko.',say:'yah sahm MAR-ko',note:'Another way to introduce yourself.'}
   ]},
  {id:'l4',unit:2,bs:'Porodica',en:'Family',mins:5,
   items:[
     {id:'porodica',bs:'Porodica',en:'Family',say:'PO-ro-dee-tsa',note:'The “c” sounds like “ts” in cats.'},
     {id:'mama',bs:'Mama',en:'Mum / Mom',say:'MAH-ma',note:'The everyday word. “Majka” is the more formal one.'},
     {id:'tata',bs:'Tata',en:'Dad',say:'TAH-ta',note:'The everyday word. “Otac” is the more formal one.'},
     {id:'brat',bs:'Brat',en:'Brother',say:'braht',note:'Friends often call each other “brate” too.'},
     {id:'sestra',bs:'Sestra',en:'Sister',say:'SEHS-tra'},
     {id:'baka',bs:'Baka',en:'Grandmother',say:'BAH-ka'},
     {id:'djed',bs:'Djed',en:'Grandfather',say:'jed',note:'Written “dj”, but it is the same soft sound as “đ” in doviđenja.'}
   ]},
  {id:'l5',unit:2,bs:'Moja porodica',en:'My family',mins:4,
   items:[
     {id:'ovo-je-moja-mama',bs:'Ovo je moja mama.',en:'This is my mum.',say:'O-vo yeh MO-ya MAH-ma',note:'“Moja” goes with feminine words, “moj” with masculine ones.'},
     {id:'ovo-je-moj-tata',bs:'Ovo je moj tata.',en:'This is my dad.',say:'O-vo yeh moy TAH-ta',note:'“Tata” ends in -a but is masculine, so it takes “moj”.'},
     {id:'imam-brata',bs:'Imam brata.',en:'I have a brother.',say:'EE-mam BRAH-ta',note:'After “imam” (I have), “brat” becomes “brata”. Many words change like this.'},
     {id:'imam-sestru',bs:'Imam sestru.',en:'I have a sister.',say:'EE-mam SEHS-troo',note:'Here “sestra” becomes “sestru”. Words ending in -a often take -u.'}
   ]},
  {id:'l6',unit:2,bs:'Brojevi',en:'Numbers 1 to 10',mins:6,
   items:[
     {id:'jedan',bs:'Jedan',en:'One (1)',say:'YEH-dahn',note:'Before a noun it changes: “jedna” (feminine), “jedno” (neuter).'},
     {id:'dva',bs:'Dva',en:'Two (2)',say:'dvah',note:'With feminine words it becomes “dvije”, as in “dvije sestre”.'},
     {id:'tri',bs:'Tri',en:'Three (3)',say:'tree',note:'Like “tree”, with a quick tapped “r”.'},
     {id:'cetiri',bs:'Četiri',en:'Four (4)',say:'CHEH-tee-ree',note:'It starts with the “č” from čaj.'},
     {id:'pet',bs:'Pet',en:'Five (5)',say:'peht'},
     {id:'sest',bs:'Šest',en:'Six (6)',say:'shehst',note:'It starts with the “š” from škola.'},
     {id:'sedam',bs:'Sedam',en:'Seven (7)',say:'SEH-dahm',note:'Easy to mix up with “osam”.'},
     {id:'osam',bs:'Osam',en:'Eight (8)',say:'O-sahm',note:'Easy to mix up with “sedam”.'},
     {id:'devet',bs:'Devet',en:'Nine (9)',say:'DEH-veht'},
     {id:'deset',bs:'Deset',en:'Ten (10)',say:'DEH-seht'}
   ]},
  {id:'l7',unit:3,bs:'Ne razumijem',en:'When you get stuck',mins:5,
   items:[
     {id:'ne-razumijem',bs:'Ne razumijem.',en:'I don’t understand.',say:'neh rah-ZOO-mee-yem',note:'Short, polite and always welcome. People will slow down for you.'},
     {id:'razumijem',bs:'Razumijem.',en:'I understand.',say:'rah-ZOO-mee-yem',note:'Add “malo” (a little) if it is only partly true: “Razumijem malo.”'},
     {id:'mozes-li-ponoviti',bs:'Možeš li ponoviti?',en:'Can you repeat that?',say:'MO-zhesh lee po-NO-vee-tee',note:'To someone older or someone you do not know, say “Možete li ponoviti?”.'},
     {id:'govori-sporije',bs:'Govori sporije, molim te.',en:'Speak more slowly, please.',say:'GO-vo-ree SPO-ree-yeh, MO-leem teh',note:'“Molim te” is the friendly “please”, for family and friends.'},
     {id:'sta-to-znaci',bs:'Šta to znači?',en:'What does that mean?',say:'shta to ZNAH-chee',note:'“Šta” is “what”. Say the word you heard first, then ask this.'},
     {id:'kako-se-ovo-kaze',bs:'Kako se ovo kaže?',en:'How do you say this?',say:'KAH-ko seh O-vo KAH-zheh',note:'Point at something and ask. Add “na bosanskom” (in Bosnian) if you like.'}
   ]},
  {id:'l8',unit:3,bs:'Učim bosanski',en:'I’m learning Bosnian',mins:5,
   items:[
     {id:'ucim-bosanski',bs:'Učim bosanski.',en:'I’m learning Bosnian.',say:'OO-cheem BO-sahn-skee',note:'“Učim” means “I learn” and “I am learning”.'},
     {id:'govorim-malo-bosanski',bs:'Govorim malo bosanski.',en:'I speak a little Bosnian.',say:'GO-vo-reem MAH-lo BO-sahn-skee',note:'“Malo” means “a little”.'},
     {id:'ne-znam',bs:'Ne znam.',en:'I don’t know.',say:'neh znahm',note:'“Ne” goes before the verb to make it negative, as in “ne razumijem”.'},
     {id:'izvini',bs:'Izvini.',en:'Sorry / excuse me.',say:'EEZ-vee-nee',note:'To friends and family. To someone older, or formally, say “Izvinite”.'},
     {id:'nema-problema',bs:'Nema problema.',en:'No problem.',say:'NEH-ma PRO-ble-ma',note:'You will recognise this one.'},
     {id:'da',bs:'Da',en:'Yes',say:'dah'},
     {id:'ne',bs:'Ne',en:'No',say:'neh'}
   ]},
  {id:'l9',unit:4,bs:'Hrana i piće',en:'Food and drink',mins:5,
   items:[
     {id:'voda',bs:'Voda',en:'Water',say:'VO-da'},
     {id:'kafa',bs:'Kafa',en:'Coffee',say:'KAH-fa',note:'Bosnian coffee is a small ritual, served in a little pot called a džezva.'},
     {id:'caj',bs:'Čaj',en:'Tea',say:'chy',note:'It starts with the “č” from the sound guide. It sounds like English “chai”.'},
     {id:'sok',bs:'Sok',en:'Juice',say:'sohk'},
     {id:'mlijeko',bs:'Mlijeko',en:'Milk',say:'MLEE-yeh-ko',note:'Spelled “ije” but said “ee-yeh”. Bosnian keeps this sound where Serbian often says “mleko”.'},
     {id:'hljeb',bs:'Hljeb',en:'Bread',say:'hlyehb',note:'The Bosnian word for bread. In Croatia you will hear “kruh”.'},
     {id:'sir',bs:'Sir',en:'Cheese',say:'seer'}
   ]},
  {id:'l10',unit:4,bs:'Dobar tek!',en:'Eating together',mins:5,
   items:[
     {id:'dobar-tek',bs:'Dobar tek!',en:'Enjoy your meal!',say:'DO-bar tehk',note:'Said before everyone eats. A friendly reply is “Hvala, i tebi” (thanks, you too).'},
     {id:'ukusno-je',bs:'Ukusno je.',en:'It’s delicious.',say:'OO-koos-no yeh',note:'The best compliment you can give the cook.'},
     {id:'gladan-sam',bs:'Gladan sam.',en:'I’m hungry.',say:'GLAH-dahn sahm',note:'Women say “gladna sam”. Adjectives change to match the person speaking.'},
     {id:'zedan-sam',bs:'Žedan sam.',en:'I’m thirsty.',say:'ZHEH-dahn sahm',note:'Women say “žedna sam”.'},
     {id:'vodu-molim',bs:'Vodu, molim.',en:'Water, please.',say:'VO-doo, MO-leem',note:'“Voda” becomes “vodu” here, the same -a to -u change as in “imam sestru”.'},
     {id:'kafu-molim',bs:'Kafu, molim.',en:'A coffee, please.',say:'KAH-foo, MO-leem',note:'The same change again: “kafa” becomes “kafu”.'},
     {id:'dosta-je-hvala',bs:'Dosta je, hvala.',en:'That’s enough, thanks.',say:'DO-sta yeh, HVAH-la',note:'Handy when family keeps offering you more food.'}
   ]},
  {id:'l11',unit:5,bs:'Ko, šta, gdje?',en:'Question words',mins:5,
   items:[
     {id:'ko',bs:'Ko?',en:'Who?',say:'koh',note:'Croatian says “tko”. Bosnian drops the “t”.'},
     {id:'sta',bs:'Šta?',en:'What?',say:'shtah',note:'Croatian says “što”. In Bosnian it is “šta”, with the “š” from škola.'},
     {id:'gdje',bs:'Gdje?',en:'Where?',say:'GDYEH',note:'Both letters at the start are said: a quick “g” straight into “dyeh”.'},
     {id:'kada',bs:'Kada?',en:'When?',say:'KAH-da',note:'You will often hear the short form “kad”.'},
     {id:'zasto',bs:'Zašto?',en:'Why?',say:'ZAHSH-to',note:'The “š” is the same as in “šta”.'},
     {id:'kako',bs:'Kako?',en:'How?',say:'KAH-ko',note:'The same word you already know from “Kako si?”.'}
   ]},
  {id:'l12',unit:5,bs:'Šta je ovo?',en:'Questions in use',mins:6,
   items:[
     {id:'sta-je-ovo',bs:'Šta je ovo?',en:'What is this?',say:'shta yeh O-vo',note:'Point and ask. “Ovo” means “this”.'},
     {id:'ko-je-to',bs:'Ko je to?',en:'Who is that?',say:'ko yeh TO',note:'“To” means “that”.'},
     {id:'gdje-je-mama',bs:'Gdje je mama?',en:'Where is Mum?',say:'GDYEH yeh MAH-ma',note:'Swap in “tata”, “baka” or “djed”.'},
     {id:'gdje-je-kupatilo',bs:'Gdje je kupatilo?',en:'Where is the bathroom?',say:'GDYEH yeh KOO-pa-tee-lo',note:'“Kupatilo” is the bathroom. Handy anywhere.'},
     {id:'sta-radis',bs:'Šta radiš?',en:'What are you doing?',say:'shta RAH-deesh',note:'A very common way to start a chat with family.'},
     {id:'kako-je-baka',bs:'Kako je baka?',en:'How is Grandma?',say:'KAH-ko yeh BAH-ka',note:'Ask after anyone: “Kako je tata?”, “Kako je brat?”.'},
     {id:'koliko-kosta',bs:'Koliko košta?',en:'How much does it cost?',say:'KO-lee-ko KOSH-ta',note:'Works in any shop or café.'}
   ]},
  {id:'l13',unit:6,bs:'Danas i sutra',en:'Today and tomorrow',mins:5,
   items:[
     {id:'danas',bs:'Danas',en:'Today',say:'DAH-nas',note:'It comes from “dan”, the word for “day”, as in “Dobar dan”.'},
     {id:'sutra',bs:'Sutra',en:'Tomorrow',say:'SOO-tra',note:'Handy for making plans, and you will use it in “Vidimo se sutra”.'},
     {id:'jucer',bs:'Jučer',en:'Yesterday',say:'YOO-cher',note:'Many people also say “juče”. Both are everyday words.'},
     {id:'sada',bs:'Sada',en:'Now',say:'SAH-da',note:'The short form “sad” is just as common.'},
     {id:'ujutro',bs:'Ujutro',en:'In the morning',say:'OO-yoo-tro',note:'Built from “jutro”, the word in “Dobro jutro”.'},
     {id:'uvecer',bs:'Uvečer',en:'In the evening',say:'OO-veh-cher',note:'“Večer” on its own is “evening”.'},
     {id:'laku-noc',bs:'Laku noć.',en:'Good night.',say:'LAH-koo noch',note:'Said at bedtime. Literally something like “an easy night”.'}
   ]},
  {id:'l14',unit:6,bs:'Dani u sedmici',en:'Days of the week',mins:6,
   items:[
     {id:'koji-je-danas-dan',bs:'Koji je danas dan?',en:'What day is it today?',say:'KO-yee yeh DAH-nas dahn',note:'Answer with “Danas je” and a day, for example “Danas je petak”.'},
     {id:'ponedjeljak',bs:'Ponedjeljak',en:'Monday',say:'po-NEH-dyeh-lyak',note:'The Bosnian spelling has “dje”. In Serbia you may hear “ponedeljak”.'},
     {id:'utorak',bs:'Utorak',en:'Tuesday',say:'OO-to-rak'},
     {id:'srijeda',bs:'Srijeda',en:'Wednesday',say:'SREE-yeh-da',note:'Spelled “ije” but said “ee-yeh”, like “mlijeko”.'},
     {id:'cetvrtak',bs:'Četvrtak',en:'Thursday',say:'CHEHT-vr-tak',note:'It starts with the “č” from “čaj”.'},
     {id:'petak',bs:'Petak',en:'Friday',say:'PEH-tak',note:'From “pet”, five: the fifth day of the week.'},
     {id:'subota',bs:'Subota',en:'Saturday',say:'SOO-bo-ta'},
     {id:'nedjelja',bs:'Nedjelja',en:'Sunday',say:'NEH-dyel-ya',note:'The word for “week” is “sedmica”, which gives this lesson its name.'}
   ]},
  {id:'l15',unit:7,bs:'Želim i volim',en:'Wanting and liking',mins:6,
   items:[
     {id:'zelim-kafu',bs:'Želim kafu.',en:'I want a coffee.',say:'ZHEH-leem KAH-foo',note:'“Želim” means “I want”. “Kafa” becomes “kafu” again.'},
     {id:'zelim-uciti',bs:'Želim učiti bosanski.',en:'I want to learn Bosnian.',say:'ZHEH-leem OO-chee-tee BO-sahn-skee',note:'After “želim”, a second verb stays in its “to …” form: “učiti”.'},
     {id:'ne-zelim',bs:'Ne želim.',en:'I don’t want to.',say:'neh ZHEH-leem',note:'The same pattern as “ne znam”: “ne” goes in front of the verb.'},
     {id:'volim-kafu',bs:'Volim kafu.',en:'I like coffee.',say:'VO-leem KAH-foo',note:'“Volim” means “I like” and also “I love”.'},
     {id:'ne-volim-caj',bs:'Ne volim čaj.',en:'I don’t like tea.',say:'neh VO-leem chy',note:'No ending change here: “čaj” is a masculine word and stays as it is.'},
     {id:'volim-muziku',bs:'Volim muziku.',en:'I like music.',say:'VO-leem MOO-zee-koo',note:'The -a to -u change once more: “muzika” becomes “muziku”.'},
     {id:'volim-bosnu',bs:'Volim Bosnu.',en:'I love Bosnia.',say:'VO-leem BOS-noo',note:'The same change: “Bosna” becomes “Bosnu”.'}
   ]},
  {id:'l16',unit:7,bs:'Imam i treba mi',en:'Having and needing',mins:6,
   items:[
     {id:'imam-pitanje',bs:'Imam pitanje.',en:'I have a question.',say:'EE-mahm PEE-tah-nyeh',note:'A polite way to start a question. “Imam” means “I have”, as in “imam brata”.'},
     {id:'nemam-brata',bs:'Nemam brata.',en:'I don’t have a brother.',say:'NEH-mahm BRAH-ta',note:'“Nemam” is “ne” and “imam” joined together. It is the opposite of “imam brata”.'},
     {id:'imam-dva-brata',bs:'Imam dva brata.',en:'I have two brothers.',say:'EE-mahm dvah BRAH-ta',note:'After two, three and four the noun takes the “brata” form, not “brat”.'},
     {id:'imam-dvije-sestre',bs:'Imam dvije sestre.',en:'I have two sisters.',say:'EE-mahm DVEE-yeh SEH-stre',note:'Feminine words use “dvije” instead of “dva”, and “sestra” becomes “sestre”.'},
     {id:'treba-mi-pomoc',bs:'Treba mi pomoć.',en:'I need help.',say:'TREH-ba mee PO-moch',note:'Literally “help is needed to me”. Swap in anything you need: “Treba mi voda”.'},
     {id:'mogu-li-dobiti-vodu',bs:'Mogu li dobiti vodu?',en:'Can I have some water?',say:'MO-goo lee DO-bee-tee VO-doo',note:'“Mogu li” starts a polite “may I?” question. Put any food or drink at the end.'}
   ]},
  {id:'l17',unit:8,bs:'Lijevo, desno',en:'Directions',mins:6,
   items:[
     {id:'lijevo',bs:'Lijevo',en:'Left',say:'LEE-yeh-vo',note:'Another “ije” word, said “ee-yeh”. Serbian says “levo”.'},
     {id:'desno',bs:'Desno',en:'Right',say:'DEHS-no'},
     {id:'pravo',bs:'Pravo',en:'Straight ahead',say:'PRAH-vo',note:'Often used in a chain: “Pravo, pa lijevo” means “straight, then left”.'},
     {id:'blizu',bs:'Blizu',en:'Near',say:'BLEE-zoo'},
     {id:'daleko',bs:'Daleko',en:'Far',say:'DAH-leh-ko'},
     {id:'je-li-daleko',bs:'Je li daleko?',en:'Is it far?',say:'yeh lee DAH-leh-ko',note:'“Je li” turns a statement into a yes or no question: “Je li blizu?” is “Is it near?”.'},
     {id:'gdje-je-stanica',bs:'Gdje je autobuska stanica?',en:'Where is the bus station?',say:'GDYEH yeh OW-to-boo-ska STAH-nee-tsa',note:'The same pattern as “Gdje je kupatilo?”. “Stanica” on its own also means a stop or station.'}
   ]},
  {id:'l18',unit:8,bs:'Idem…',en:'Where I’m going',mins:6,
   items:[
     {id:'ovdje',bs:'Ovdje',en:'Here',say:'OV-dyeh',note:'The Bosnian spelling has “dje”. Serbian says “ovde”.'},
     {id:'tamo',bs:'Tamo',en:'There',say:'TAH-mo'},
     {id:'gdje-ides',bs:'Gdje ideš?',en:'Where are you going?',say:'GDYEH EE-desh',note:'“Ideš” means “you go” and “idem” means “I go”.'},
     {id:'idem-u-grad',bs:'Idem u grad.',en:'I’m going into town.',say:'EE-dem oo grahd',note:'“U grad” means “into town”. “Grad” is a town or a city.'},
     {id:'idem-kuci',bs:'Idem kući.',en:'I’m going home.',say:'EE-dem KOO-chee',note:'“Kuća” is “house”, but “kući” on its own means “home”. No extra word for “to”.'},
     {id:'idem-na-posao',bs:'Idem na posao.',en:'I’m going to work.',say:'EE-dem na PO-sa-o',note:'“Posao” means work or a job. Use “na” with it: “na posao”.'}
   ]},
  {id:'l19',unit:9,bs:'Moj dan',en:'My day',mins:6,
   items:[
     {id:'ustajem-u-sedam',bs:'Ustajem u sedam.',en:'I get up at seven.',say:'OO-sta-yem oo SEH-dahm',note:'“U sedam” means “at seven”. Swap in any number you know from Unit 2.'},
     {id:'dorucak',bs:'Doručak',en:'Breakfast',say:'DO-roo-chak'},
     {id:'rucak',bs:'Ručak',en:'Lunch',say:'ROO-chak',note:'Lunch is often the main meal of the day.'},
     {id:'vecera',bs:'Večera',en:'Dinner',say:'VEH-che-ra'},
     {id:'sta-je-za-rucak',bs:'Šta je za ručak?',en:'What’s for lunch?',say:'shta yeh za ROO-chak',note:'Swap in “doručak” or “večeru”. After “za”, “večera” becomes “večeru”.'},
     {id:'kuham-rucak',bs:'Kuham ručak.',en:'I’m cooking lunch.',say:'KOO-ham ROO-chak',note:'“Kuham” means “I cook”. “Ručak” doesn’t change here.'},
     {id:'radim-danas',bs:'Radim danas.',en:'I’m working today.',say:'RAH-deem DAH-nas',note:'You know “radiš” from “Šta radiš?”. “Radim” is the “I” form.'}
   ]},
  {id:'l20',unit:9,bs:'Poslije posla',en:'After work',mins:6,
   items:[
     {id:'citam-knjigu',bs:'Čitam knjigu.',en:'I’m reading a book.',say:'CHEE-tam KNYEE-goo',note:'“Knjiga” becomes “knjigu”, the same -a to -u change.'},
     {id:'gledam-film',bs:'Gledam film.',en:'I’m watching a film.',say:'GLEH-dam feelm',note:'“Gledam” means “I watch” or “I look at”.'},
     {id:'slusam-muziku',bs:'Slušam muziku.',en:'I’m listening to music.',say:'SLOO-sham MOO-zee-koo',note:'“Slušam” means “I listen”. The same “muziku” as in “volim muziku”.'},
     {id:'pomazem-mami',bs:'Pomažem mami.',en:'I’m helping Mum.',say:'po-MAH-zhem MAH-mee',note:'After “pomažem” (I help), “mama” becomes “mami”.'},
     {id:'umoran-sam',bs:'Umoran sam.',en:'I’m tired.',say:'OO-mo-rahn sahm',note:'Women say “umorna sam”, just like “gladna sam”.'},
     {id:'idem-spavati',bs:'Idem spavati.',en:'I’m going to sleep.',say:'EE-dem SPAH-va-tee',note:'“Idem” plus a “to …” verb means “I’m going to …”. “Spavati” is “to sleep”.'}
   ]},
  {id:'l21',unit:10,bs:'Osjećaji',en:'Feelings',mins:6,
   items:[
     {id:'sretan-sam',bs:'Sretan sam.',en:'I’m happy.',say:'SREH-tahn sahm',note:'Women say “sretna sam”.'},
     {id:'tuzan-sam',bs:'Tužan sam.',en:'I’m sad.',say:'TOO-zhahn sahm',note:'Women say “tužna sam”.'},
     {id:'ljut-sam',bs:'Ljut sam.',en:'I’m angry.',say:'lyoot sahm',note:'Women say “ljuta sam”. The “lj” sounds like the “lli” in “million”.'},
     {id:'volim-te',bs:'Volim te.',en:'I love you.',say:'VO-leem teh',note:'Short and warm. “Te” means “you”. Families say it too, not only couples.'},
     {id:'nedostajes-mi',bs:'Nedostaješ mi.',en:'I miss you.',say:'neh-DO-sta-yesh mee',note:'Literally “you are missing to me”. “Mi” means “to me”, as in “treba mi”.'},
     {id:'mnogo-te-volim',bs:'Mnogo te volim.',en:'I love you very much.',say:'MNO-go teh VO-leem',note:'“Mnogo” means “a lot”. Here it goes at the front.'}
   ]},
  {id:'l22',unit:10,bs:'Za porodicu',en:'Warm words for family',mins:6,
   items:[
     {id:'sretan-rodjendan',bs:'Sretan rođendan!',en:'Happy birthday!',say:'SREH-tahn RO-jen-dahn',note:'The “đ” is a soft “j” sound, as in “jam”.'},
     {id:'cestitam',bs:'Čestitam!',en:'Congratulations!',say:'CHEH-stee-tam',note:'Use it for a birthday, a new job, a wedding or an exam.'},
     {id:'zivjeli',bs:'Živjeli!',en:'Cheers!',say:'ZHEE-vyeh-lee',note:'Said when you clink glasses. It means “may you live”.'},
     {id:'dobro-dosli',bs:'Dobro došli!',en:'Welcome!',say:'DO-bro DOSH-lee',note:'This is the plural, for guests. For one man say “dobro došao”, for one woman “dobro došla”.'},
     {id:'pozdravi-mamu',bs:'Pozdravi mamu.',en:'Say hello to Mum.',say:'POZ-dra-vee MAH-moo',note:'Literally “greet Mum”. Said when you can’t be there yourself.'},
     {id:'vidimo-se-sutra',bs:'Vidimo se sutra.',en:'See you tomorrow.',say:'VEE-dee-mo seh SOO-tra',note:'Literally “we see each other tomorrow”. You know “sutra” from Unit 6.'},
     {id:'hvala-ti',bs:'Hvala ti.',en:'Thank you (to you).',say:'HVAH-la tee',note:'Adding “ti” makes it personal, said to one person you know well.'}
   ]}
];
var UNITS=[{n:1,bs:'Pozdravi',en:'Greetings'},{n:2,bs:'Porodica i brojevi',en:'Family and numbers'},{n:3,bs:'Razgovor',en:'Keeping a conversation going'},{n:4,bs:'Za stolom',en:'At the table'},{n:5,bs:'Pitanja',en:'Asking questions'},{n:6,bs:'Dani i vrijeme',en:'Days and time'},{n:7,bs:'Želim, volim, imam',en:'Wants, likes and having'},{n:8,bs:'U gradu',en:'Out and about'},{n:9,bs:'Svakodnevica',en:'Daily life'},{n:10,bs:'Razgovor s porodicom',en:'Talking with family'}];
var ITEM={};
LESSONS.forEach(function(L){ (L.items||[]).forEach(function(it){ it.lesson=L.id; ITEM[it.id]=it; }); });

/* ---------- helpers ---------- */
var DAY=86400000;
var INTERVALS=[0,1,3,7,16,35];           /* days until next review, by new strength 0..5 */
var GOAL=20;                              /* practice questions per day, about 10 minutes */
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function chunk(a,n){ var r=[]; for(var i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtSpan(ms){
  var m=Math.round(ms/60000);
  if(m<60) return Math.max(1,m)+' min';
  var h=Math.round(m/60);
  if(h<36) return h+' h';
  var d=Math.round(ms/DAY);
  if(d<14) return d+(d===1?' day':' days');
  return Math.round(d/7)+' weeks';
}

/* ---------- audio: recorded clips first, browser text-to-speech as a fallback ---------- */
var TTS=typeof window!=='undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance!=='undefined';
var CLIP=typeof window!=='undefined' && typeof window.Audio==='function';
var AUDIO=TTS||CLIP;
var VOICE=null;
/* lower-case Bosnian text -> clip file. Every lesson phrase has one (named by its id), plus the sound-guide words. */
var CLIPS={};
Object.keys(ITEM).forEach(function(id){ CLIPS[ITEM[id].bs.toLowerCase()]='audio/'+id+'.mp3'; });
[['jutro','jutro'],['čaj','caj'],['škola','skola'],['žena','zena']].forEach(function(p){ CLIPS[p[0]]='audio/'+p[1]+'.mp3'; });
var SLOW=0.7, player=null, playId=0;   /* one shared audio element: phones only let an element that a tap has started play again on its own */
function pickVoice(){
  if(!TTS) return;
  var vs=[]; try{ vs=window.speechSynthesis.getVoices()||[]; }catch(e){}
  if(!vs.length) return;
  function by(p){ for(var i=0;i<vs.length;i++){ var l=(vs[i].lang||'').toLowerCase().replace('_','-'); if(l.indexOf(p)===0) return vs[i]; } return null; }
  VOICE=by('bs')||by('hr')||by('sr')||null;
}
function stopAudio(){
  playId++;                                   /* anything still waiting on the old playback is now stale */
  try{ if(player){ player.pause(); player.onended=null; player.onerror=null; player.onplaying=null; } }catch(e){}
  if(TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}
/* done(ms) is called once, with how long the sound took, when this playback ends by itself.
   It is never called if another sound starts first or the page stops the audio. */
function once(f){ if(!f) return null; var fired=false; return function(ms){ if(!fired){ fired=true; f(ms); } }; }
function finish(id,done,t0){ if(id===playId && done) done(Math.max(0,Date.now()-t0)); }
function tts(text,rate,id,done){
  var t0=Date.now();
  if(!TTS){ finish(id,done,t0); return; }
  try{
    var u=new window.SpeechSynthesisUtterance(text);
    if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; } else { u.lang='bs-BA'; }
    u.rate=rate||0.9;
    u.onend=function(){ finish(id,done,t0); };
    u.onerror=function(){ finish(id,done,t0); };
    window.speechSynthesis.speak(u);
  }catch(e){ finish(id,done,t0); }
}
/* plays one file through the shared element; onfail runs if it cannot load or play */
function playSrc(url,r,onfail,done){
  var id=playId;
  try{
    var a=player||(player=new window.Audio()), t0=Date.now();
    try{ a.preload='auto'; a.defaultPlaybackRate=r; a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; }catch(e){}
    a.onerror=function(){ if(id===playId) onfail(); };
    a.onplaying=function(){ t0=Date.now(); };
    a.onended=function(){ finish(id,done,t0); };
    a.onloadedmetadata=function(){ try{ a.playbackRate=r; }catch(e){} };
    a.src=url;
    try{ a.playbackRate=r; }catch(e){}
    var p=a.play();
    if(p && typeof p.catch==='function') p.catch(function(err){
      if(id===playId && err && err.name!=='AbortError' && err.name!=='NotAllowedError') onfail();
    });
  }catch(e){ onfail(); }
}
/* rate below 0.8 means "slow": clips are played at SLOW speed, the browser voice at the rate given */
function speak(text,rate,done){
  if(!AUDIO) return;
  stopAudio();
  done=once(done);
  var id=playId, url=CLIPS[String(text).toLowerCase()], slow=!!rate && rate<0.8;
  if(!url || !CLIP){ tts(text,rate,id,done); return; }
  playSrc(url,slow?SLOW:1,function(){ tts(text,rate,id,done); },done);
}
/* the learner's own recording */
function playTake(url,done){
  stopAudio(); done=once(done);
  if(!CLIP){ if(done) done(0); return; }
  playSrc(url,1,function(){ if(done) done(0); },done);
}
/* A tap starts this element once; after that the page may start it again by itself (needed on phones). */
var SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockPlayer(){
  if(!CLIP) return;
  stopAudio();
  try{ var a=player||(player=new window.Audio()); a.src=SILENT; var p=a.play(); if(p && typeof p.catch==='function') p.catch(function(){}); }catch(e){}
}
function voiceNote(){
  if(!AUDIO) return 'Audio is not available in this browser. Lessons still work; the listening questions are skipped.';
  if(CLIP) return 'Audio is an AI-generated voice (ElevenLabs “Sini”), picked from the Croatian voices, so a few sounds may differ slightly from Bosnian. The finished app will use recordings of native Bosnian speakers.';
  if(VOICE){
    if(/^bs/i.test(VOICE.lang)) return 'Prototype audio uses the “'+VOICE.name+'” voice on your device. The finished app will use recordings of Bosnian speakers.';
    return 'No Bosnian voice was found, so prototype audio uses a “'+VOICE.name+'” voice ('+VOICE.lang+'). It will sound close but not exact. The finished app will use recordings of Bosnian speakers.';
  }
  return 'Prototype audio uses your device’s default voice, which may not sound Bosnian. The finished app will use recordings of Bosnian speakers.';
}

/* ---------- saved progress (this browser only) ---------- */
var KEY='hajde.prototype.v1';
function fresh(){ return {done:{},cards:{},days:[],today:{date:'',n:0}}; }
function load(){
  try{ var raw=window.localStorage.getItem(KEY); if(raw){ var s=JSON.parse(raw); if(s && s.cards) return s; } }catch(e){}
  return fresh();
}
var state=load();
function save(){ try{ window.localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function markDay(){ var k=dayKey(); if(state.days.indexOf(k)<0) state.days.push(k); }
function bumpReps(n){
  var k=dayKey();
  if(state.today.date!==k) state.today={date:k,n:0};
  state.today.n+=n; markDay(); save();
}
function todayReps(){ return state.today.date===dayKey()?state.today.n:0; }
function streak(){
  var set={}; state.days.forEach(function(d){ set[d]=1; });
  var d=new Date(), n=0;
  if(!set[dayKey(d)]) d.setDate(d.getDate()-1);
  while(set[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function dueIds(){
  var now=Date.now();
  return Object.keys(state.cards).filter(function(id){ return ITEM[id] && state.cards[id].due<=now; });
}

/* ---------- exercise generation ---------- */
function tokens(s){ return s.replace(/[.,!?]/g,'').split(/\s+/); }
function isBuildable(it){ var t=tokens(it.bs); return t.length>=2 && t.length<=5; }
function mcq(kind,it,lesson){
  var others=shuffle(lesson.items.filter(function(x){ return x.id!==it.id; })).slice(0,2);
  var toBs=(kind==='translate');
  var opts=shuffle([it].concat(others)).map(function(x){ return {id:x.id,label:toBs?x.bs:x.en,correct:x.id===it.id}; });
  return {type:kind,item:it,opts:opts};
}
function buildStep(it,lesson){
  var ans=tokens(it.bs), low=ans.map(function(a){ return a.toLowerCase(); }), pool=[];
  lesson.items.forEach(function(x){
    if(x.id===it.id) return;
    tokens(x.bs).forEach(function(w){
      var lw=w.toLowerCase();
      if(low.indexOf(lw)<0 && pool.map(function(p){ return p.toLowerCase(); }).indexOf(lw)<0) pool.push(w);
    });
  });
  var bank=shuffle(ans.concat(shuffle(pool).slice(0,2))).map(function(w,i){ return {k:'t'+i,w:w}; });
  return {type:'build',item:it,ans:ans,bank:bank};
}
function makeSteps(lesson){
  var items=lesson.items, steps=[];
  if(lesson.tip) steps.push({type:'tip',tip:lesson.tip});
  chunk(items,3).forEach(function(b){
    b.forEach(function(it){ steps.push({type:'intro',item:it}); });
    b.forEach(function(it,i){ steps.push(mcq((i%2===1 && AUDIO)?'listen':'meaning',it,lesson)); });
  });
  steps.push({type:'match',items:sample(items,Math.min(4,items.length))});
  shuffle(items).slice(0,3).forEach(function(it){ steps.push(mcq('translate',it,lesson)); });
  shuffle(items.filter(isBuildable)).slice(0,2).forEach(function(it){ steps.push(buildStep(it,lesson)); });
  if(AUDIO) steps.push(mcq('listen',shuffle(items)[0],lesson));
  items.slice().sort(function(a,b){ return b.bs.length-a.bs.length; }).slice(0,3).forEach(function(it){ steps.push({type:'say',item:it}); });
  return steps;
}

/* ---------- microphone (optional: only where the page is allowed to use it) ---------- */
var PKEY='hajde.prefs.v1';
function loadPrefs(){

var prefs=loadPrefs();

    cb(true,{stream:stream,ctx:ctx,an:an,buf:an?new Uint8Array(an.fftSize):null,mr:null,chunks:[],mime:'',peak:0});
  },function(e){ try{ if(ctx&&ctx.close) ctx.close(); }catch(x){} cb(false,(e&&e.name)||'Error'); });
}
function micShut(m){

/* cb({voiced:true,url}) | {voiced:false} | null (recorder failed) */

/* ---------- speak: repeat after me ----------
   Each phrase: hear it, a gap to say it, hear it slowly, a second gap. The gap is sized from how long the phrase took to play.

   Recordings live in memory only and are thrown away when you leave the session. */

function shClear(){ if(shTimer){ clearTimeout(shTimer); shTimer=null; } }

function startShadow(key){
  var set=speakSets()[key];

  unlockPlayer();                                   /* still inside the tap: lets later clips play */
  var s=sh={key:key,title:set.title,q:set.items,idx:0,phase:'listen',paused:false,token:0,heard:1200,gap:0,done:0,finished:false,
    rec:false,wait:false,recording:false,note:'',takes:{}};

  if(turn){
    s.gap=shGapMs(s.heard);
    var rec=(ph==='turn2' && s.rec) ? recStart() : false;
    s.recording=rec; renderRoot();
    shTimer=setTimeout(function(){
      shTimer=null; if(!live()) return;
      if(ph==='turn') return go('slow');
      if(!rec) return shNext();
      recStop(function(res){
        if(!live()){ if(res && res.url) try{ window.URL.revokeObjectURL(res.url); }catch(e){} return; }
        if(res && res.voiced){ dropTake(s,s.idx); s.takes[s.idx]={url:res.url}; go('you'); }
        else if(res) go('nohear');
        else shNext();
      });
    },s.gap);
  } else if(ph==='nohear'){
    s.gap=0; renderRoot();
    shTimer=setTimeout(function(){ shTimer=null; if(live()) shNext(); },1600);
  } else if(ph==='you'){
    var take=s.takes[s.idx]; s.gap=0; renderRoot();
    if(!take){ go('model'); return; }
    playTake(take.url,function(){ if(live()) go('model'); });
    shTimer=setTimeout(function(){ shTimer=null; if(live()) go('model'); },15000);
  } else {                                           /* listen, slow, model: the clip is the model */
    s.gap=0; renderRoot();
    speak(p.bs,ph==='slow'?0.55:0.9,function(ms){
      if(!live()) return;
      if(ph!=='model') s.heard=ms||1200;
      if(ph==='model') shNext(); else go(ph==='listen'?'turn':'turn2');
    });
    shTimer=setTimeout(function(){ shTimer=null; if(!live()) return; if(ph!=='model') s.heard=1500; if(ph==='model') shNext(); else go(ph==='listen'?'turn':'turn2'); },9000);   /* audio blocked or silent: carry on */
  }
}
function shNext(){
  var s=sh; if(!s) return;
  s.done++; bumpReps(1); s.idx++; s.phase='listen';
  if(s.idx>=s.q.length) shFinish(); else shRun();
}
function shFinish(){ shClear(); recDiscard(); micClose(); stopAudio(); sh.token++; sh.recording=false; sh.finished=true; renderRoot(); window.scrollTo(0,0); }
function shHalt(s){ shClear(); recDiscard(); stopAudio(); s.token++; }          /* pause, skip, hear again */
function renderShadowWait(){
  view.innerHTML=
    '<section class="lesson"><header class="lesson-top"><button class="icon-btn" data-act="sh-exit" aria-label="Leave this session">'+I.close+'</button>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span style="width:0%"></span></div></header>'+
    '<div class="stage say-stage"><p class="eyebrow">Repeat after me</p>'+
    '<div class="turn-card"><span class="status" role="status">Waiting for the microphone</span>'+
    '<p class="prompt">Allow the microphone</p>'+
    '<p class="en">Your browser is asking to use the microphone. Choose Allow so you can hear yourself next to the model. Nothing leaves this device.</p></div></div>'+
    '<footer class="dock"><button class="btn secondary wide" data-act="sh-norec">Carry on without recording</button></footer></section>';
}
function renderShadow(){
  var s=sh;
  if(s.finished) return renderShadowDone();
  if(s.wait) return renderShadowWait();
  var hadFocus=view.contains(document.activeElement) && document.activeElement!==document.body;
  var p=s.q[s.idx], ph=s.phase, turn=(ph==='turn'||ph==='turn2'), pct=Math.round(s.idx/s.q.length*100), label, hint;
  if(s.paused){ label='Paused'; hint='Paused. Resume when you are ready.'; }
  else if(turn){ label='Your turn'; hint='Say it out loud now.'; }
  else if(ph==='you'){ label='You'; hint='This is how you sounded.'; }
  else if(ph==='model'){ label='Model'; hint='And the model once more.'; }
  else if(ph==='nohear'){ label='Didn’t hear you'; hint='No voice came through. A little louder next time, and closer to the phone.'; }
  else { label=(ph==='slow')?'Listen, slower':'Listen'; hint='Listen first. You say it after.'; }
  var cls=(turn&&!s.paused)?' turn':'';
  var recLine=(s.recording&&!s.paused)?'<p class="rec-line"><span class="rec-dot" aria-hidden="true"></span>Recording'+(micMeter()?'<span class="lvl" aria-hidden="true"><i id="lvl"></i></span>':'')+'</p>':'';
  view.innerHTML=
    '<section class="lesson"><header class="lesson-top"><button class="icon-btn" data-act="sh-exit" aria-label="Leave this session">'+I.close+'</button>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><span style="width:'+pct+'%"></span></div></header>'+
    '<div class="stage say-stage"><p class="eyebrow">Repeat after me · <span class="set-count">'+(s.idx+1)+' of '+s.q.length+'</span></p>'+
    '<div class="turn-card'+cls+'"><span class="status'+cls+'" role="status">'+label+'</span>'+
    '<h1 class="phrase">'+esc(p.bs)+'</h1>'+(p.say?'<p class="resp">/'+esc(p.say)+'/</p>':'')+(p.hint?'<p class="resp">'+esc(p.hint)+'</p>':'')+'<p class="en">'+esc(p.en)+'</p>'+
    recLine+
    '<div class="gapbar'+(cls?'':' idle')+'" style="--gap:'+(s.gap/1000).toFixed(2)+'s" aria-hidden="true"><span></span></div></div>'+
    '<p class="hint">'+hint+'</p>'+(s.note?'<p class="fine">'+esc(s.note)+'</p>':'')+'</div>'+
    '<footer class="dock"><div class="two"><button class="btn secondary" data-act="sh-replay">Hear again</button><button class="btn secondary" data-act="sh-skip">Skip</button></div>'+
    '<button class="btn primary wide" data-act="'+(s.paused?'sh-resume':'sh-pause')+'">'+(s.paused?'Resume':'Pause')+'</button></footer></section>';
  if(hadFocus){ var b=view.querySelector('.dock .btn.primary'); if(b) try{ b.focus({preventScroll:true}); }catch(e){} }
  if(s.recording && !s.paused) lvlStart();
}
function renderShadowDone(){
  var s=sh, idxs=Object.keys(s.takes).map(Number).sort(function(a,b){ return a-b; }), hear='';
  if(idxs.length){
    hear='<div><h2 class="mini-h">Hear yourself</h2><ul class="hear">'+idxs.map(function(i){
      return '<li><span class="hear-bs">'+esc(s.q[i].bs)+'</span><span class="hear-btns">'+
        '<button class="play ghost" data-act="sh-hear" data-i="'+i+'" aria-label="Model: '+esc(s.q[i].bs)+'">Model</button>'+
        '<button class="play" data-act="sh-hearme" data-i="'+i+'" aria-label="You: '+esc(s.q[i].bs)+'">You</button></span></li>';
    }).join('')+'</ul><p class="fine" style="margin-top:10px">These recordings are only kept until you leave this screen.</p></div>';
  }
  view.innerHTML='<section class="result"><div><p class="eyebrow">Session complete</p><h1 class="display" style="margin-top:6px">Dobro!</h1>'+
    '<p class="lead">'+(s.done?('You said '+s.done+(s.done===1?' phrase':' phrases')+' out loud. A minute or two like this, most days, is plenty.'):'You skipped through this one. Come back when you can say the phrases out loud.')+'</p></div>'+
    '<div class="stats"><div class="stat"><strong>'+s.done+'</strong><span>'+esc(s.title)+' · phrases said</span></div></div>'+hear+
    (s.note?'<p class="fine">'+esc(s.note)+'</p>':'')+
    '<div class="actions"><button class="btn primary wide" data-act="sh-again">Go again</button><button class="btn secondary wide" data-act="sh-exit">Back to Speak</button></div></section>';
}

/* ---------- events ---------- */
var A={
  'sh-start':function(t){ startShadow(t.getAttribute('data-set')); },
  'sh-pause':function(){ var s=sh; if(!s) return; s.paused=true; shHalt(s); renderRoot(); },
  'sh-resume':function(){ var s=sh; if(!s) return; s.paused=false; shRun(); },
  'sh-norec':function(){ var s=sh; if(!s||!s.wait) return; s.wait=false; s.note='Carrying on without recording.'; shRun(); },
  'sh-hear':function(t){ var s=sh; if(!s) return; var q=s.q[+t.getAttribute('data-i')]; if(q) speak(q.bs,0.9); },
  'sh-hearme':function(t){ var s=sh; if(!s) return; var k=s.takes[+t.getAttribute('data-i')]; if(k) playTake(k.url); },
  'toggle-rec':function(){ prefs.rec=!prefs.rec; savePrefs(); renderRoot(); },
  'sh-replay':function(){ var s=sh; if(!s||s.wait) return; shHalt(s); dropTake(s,s.idx); s.paused=false; s.phase='listen'; shRun(); },
  'sh-skip':function(){ var s=sh; if(!s||s.wait) return; shHalt(s); s.paused=false; s.idx++; s.phase='listen'; if(s.idx>=s.q.length) shFinish(); else shRun(); },
  'sh-again':function(){ var s=sh; if(s) startShadow(s.key); },
  'sh-exit':function(){ shStop(); ui.tab='speak'; renderRoot(); window.scrollTo(0,0); },
  tab:function(t){ ui.tab=t.getAttribute('data-tab'); renderRoot(); window.scrollTo(0,0); },
  open:function(t){ startLesson(t.getAttribute('data-id')); },
  say:function(t){ speak(t.getAttribute('data-text'),0.9); },
  slow:function(t){ speak(t.getAttribute('data-text'),0.55); },
  next:function(){ if(run) nextStep(); },
  opt:function(t){ if(!run||run.cur.checked) return; run.cur.sel=t.getAttribute('data-id'); paint(); },
  check:function(){ if(run) check(); },
  place:function(t){ if(!run||run.cur.checked) return; var k=t.getAttribute('data-k'); if(run.cur.placed.indexOf(k)<0){ run.cur.placed.push(k); paint(); } },
  unplace:function(t){ if(!run||run.cur.checked) return; var k=t.getAttribute('data-k'); run.cur.placed=run.cur.placed.filter(function(x){ return x!==k; }); paint(); },
  ml:function(t){ if(run) matchClick('l',t.getAttribute('data-id')); },
  mr:function(t){ if(run) matchClick('r',t.getAttribute('data-id')); },
  showtext:function(){ if(run){ run.cur.showText=true; paint(); } },
  'say-got':function(){ if(run) saySay(true); },
  'say-again':function(){ if(run) saySay(false); },
  quit:function(){ ui.quit=true; renderRoot(); },
  'quit-stay':function(){ ui.quit=false; renderRoot(); },
  'quit-leave':function(){ ui.quit=false; run=null; rev=null; renderRoot(); },
  home:function(){ run=null; rev=null; shStop(); ui.tab='learn'; renderRoot(); window.scrollTo(0,0); },
  'start-review':function(){ startReview(); },
  reveal:function(){
    if(!rev) return; rev.reveal=true; renderReviewCard();
    var id=rev.queue[rev.idx]; if(revMode(id)==='produce') speak(ITEM[id].bs,0.9);
  },
  'rate-good':function(){ if(rev) rate(true); },
  'rate-again':function(){ if(rev) rate(false); },
  reset:function(){
    if(!ui.resetArm){ ui.resetArm=true; renderRoot(); return; }
    ui.resetArm=false; state=fresh(); save(); renderRoot();
  }
};
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t||!app.contains(t)) return;
  var act=t.getAttribute('data-act');
  if(act!=='reset' && ui.resetArm){ ui.resetArm=false; }
  var f=A[act]; if(f) f(t);
});

/* ---------- start ---------- */
if(TTS){
  pickVoice();
  try{ window.speechSynthesis.onvoiceschanged=function(){ pickVoice(); var n=$('#voice-note'); if(n) n.textContent=voiceNote(); }; }catch(e){}
}
renderRoot();
})();
</script>
