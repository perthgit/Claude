<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bosnian Flashcards — Top 50 Words</title>
<meta name="description" content="A dictionary-card style flashcard app for learning the 50 most common Bosnian words.">
<style>
  :root {
    --ink: #16262a;
    --stone: #e9e3d3;
    --stone-dim: #d9d1bc;
    --card: #f3efe3;
    --copper: #b8672f;
    --copper-bright: #d98a4c;
    --petrol: #1f5c58;
    --clay: #a34638;
    --text: #1c2a2c;
    --muted: #5c6b64;
    --rule: #c9c0a5;
    --shadow: rgba(22, 38, 42, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #0f1a1c;
      --stone: #16262a;
      --stone-dim: #1b2d30;
      --card: #1c2f31;
      --copper: #d98a4c;
      --copper-bright: #f0a565;
      --petrol: #4fa39c;
      --clay: #c96a58;
      --text: #ece5d3;
      --muted: #96a39c;
      --rule: #3a4c4c;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --ink: #0f1a1c;
    --stone: #16262a;
    --stone-dim: #1b2d30;
    --card: #1c2f31;
    --copper: #d98a4c;
    --copper-bright: #f0a565;
    --petrol: #4fa39c;
    --clay: #c96a58;
    --text: #ece5d3;
    --muted: #96a39c;
    --rule: #3a4c4c;
    --shadow: rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --ink: #16262a;
    --stone: #e9e3d3;
    --stone-dim: #d9d1bc;
    --card: #f3efe3;
    --copper: #b8672f;
    --copper-bright: #d98a4c;
    --petrol: #1f5c58;
    --clay: #a34638;
    --text: #1c2a2c;
    --muted: #5c6b64;
    --rule: #c9c0a5;
    --shadow: rgba(22, 38, 42, 0.16);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--stone);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 2rem;
    background-position: 0 8.4rem;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 56px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  .masthead {
    width: 100%;
    max-width: 440px;
    text-align: left;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .masthead h1 {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }
  .masthead .catalog {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--card);
    border: 1px solid var(--rule);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    max-width: 440px;
    margin: 0 auto 10px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stats strong { color: var(--text); }
  .progress-track {
    width: 100%;
    max-width: 440px;
    height: 3px;
    background: var(--rule);
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: var(--copper);
    width: 0%;
    transition: width 0.35s ease;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 440px;
    perspective: 1400px;
  }
  .pronounce-btn {
    position: absolute;
    top: -16px;
    right: 24px;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--copper);
    font-size: 1.05rem;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px var(--shadow);
  }
  .pronounce-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pronounce-btn.speaking {
    background: var(--copper);
    color: var(--card);
    animation: pronounce-pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes pronounce-pulse {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }
  .card {
    position: relative;
    width: 100%;
    height: 300px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card:focus-visible { outline: 3px solid var(--copper); outline-offset: 4px; }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--card);
    box-shadow: 0 10px 28px var(--shadow);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--copper);
    display: flex;
    flex-direction: column;
    padding: 22px 26px 26px;
  }
  .face.back {
    transform: rotateY(180deg);
    border-top-color: var(--petrol);
  }

  .face-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .card-index { font-variant-numeric: tabular-nums; }

  .face-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .word {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, "Times New Roman", serif;
    font-size: clamp(2.1rem, 8vw, 2.7rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink);
    text-wrap: balance;
  }
  .rule {
    width: 56px;
    height: 2px;
    background: var(--rule);
  }
  .pos-tag {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--copper);
  }
  .known-note {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--petrol);
    min-height: 1em;
  }
  .hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .judge-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    width: 100%;
    max-width: 440px;
  }
  .judge-row button { flex: 1; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    max-width: 440px;
  }

  button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--ink);
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
  button.primary { background: var(--petrol); border-color: var(--petrol); color: #f3efe3; }
  button.danger { background: var(--clay); border-color: var(--clay); color: #f3efe3; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 440px;
  }
  .toolbar button {
    font-size: 0.76rem;
    padding: 8px 12px;
    background: transparent;
    border-color: var(--rule);
    color: var(--muted);
  }

  footer {
    margin-top: 32px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="btnTheme" type="button" aria-label="Toggle light/dark theme">◐ theme</button>

<div class="masthead">
  <h1>Bosanski · Rječnik</h1>
  <span class="catalog">50 headwords</span>
</div>

<div class="stats">
  <span>Card <strong id="statPos">1</strong> / 50</span>
  <span>Known <strong id="statMastered">0</strong> / 50</span>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="scene" id="scene">
  <button class="pronounce-btn" id="btnSpeak" type="button" aria-label="Pronounce the Bosnian word">🔊</button>
  <div class="card" id="card" tabindex="0" role="button" aria-pressed="false" aria-label="Flashcard, press to flip">
    <div class="face front">
      <div class="face-head">
        <span id="frontLabel">Bosnian</span>
        <span class="card-index" id="cardIndexFront"></span>
      </div>
      <div class="face-body">
        <div class="word" id="frontWord"></div>
        <div class="rule"></div>
        <div class="pos-tag" id="frontPos"></div>
      </div>
      <div class="hint">tap or press space to flip</div>
    </div>
    <div class="face back">
      <div class="face-head">
        <span id="backLabel">English</span>
        <span class="card-index" id="cardIndexBack"></span>
      </div>
      <div class="face-body">
        <div class="word" id="backWord"></div>
        <div class="rule"></div>
        <div class="known-note" id="backNote"></div>
      </div>
      <div class="hint">tap or press space to flip back</div>
    </div>
  </div>
</div>

<div class="judge-row" id="judgeRow">
  <button class="danger" id="btnAgain">Study again</button>
  <button class="primary" id="btnKnow">I know this</button>
</div>

<div class="controls">
  <button id="btnPrev">← Prev</button>
  <button id="btnFlip">Flip</button>
  <button id="btnNext">Next →</button>
</div>

<div class="toolbar">
  <button id="btnShuffle">Shuffle</button>
  <button id="btnDirection">Switch direction</button>
  <button id="btnRestart">Reset progress</button>
</div>

<footer>space flip · ← → navigate · p pronounce · k know · a study again</footer>

<script>
const WORDS = [
  { bs: "ja", en: "I", pos: "pronoun" },
  { bs: "ti", en: "you (singular)", pos: "pronoun" },
  { bs: "on", en: "he", pos: "pronoun" },
  { bs: "ona", en: "she", pos: "pronoun" },
  { bs: "mi", en: "we", pos: "pronoun" },
  { bs: "vi", en: "you (plural/formal)", pos: "pronoun" },
  { bs: "oni", en: "they", pos: "pronoun" },
  { bs: "ovaj", en: "this", pos: "pronoun" },
  { bs: "taj", en: "that", pos: "pronoun" },
  { bs: "ko", en: "who", pos: "pronoun" },
  { bs: "i", en: "and", pos: "conjunction" },
  { bs: "ili", en: "or", pos: "conjunction" },
  { bs: "ali", en: "but", pos: "conjunction" },
  { bs: "da", en: "yes / that", pos: "particle" },
  { bs: "ne", en: "no / not", pos: "particle" },
  { bs: "u", en: "in", pos: "preposition" },
  { bs: "na", en: "on / at", pos: "preposition" },
  { bs: "za", en: "for", pos: "preposition" },
  { bs: "sa", en: "with", pos: "preposition" },
  { bs: "iz", en: "from / out of", pos: "preposition" },
  { bs: "šta", en: "what", pos: "question word" },
  { bs: "gdje", en: "where", pos: "question word" },
  { bs: "kada", en: "when", pos: "question word" },
  { bs: "kako", en: "how", pos: "question word" },
  { bs: "zašto", en: "why", pos: "question word" },
  { bs: "biti", en: "to be", pos: "verb" },
  { bs: "imati", en: "to have", pos: "verb" },
  { bs: "htjeti", en: "to want", pos: "verb" },
  { bs: "moći", en: "can / to be able", pos: "verb" },
  { bs: "znati", en: "to know", pos: "verb" },
  { bs: "ići", en: "to go", pos: "verb" },
  { bs: "raditi", en: "to do / to work", pos: "verb" },
  { bs: "reći", en: "to say", pos: "verb" },
  { bs: "vidjeti", en: "to see", pos: "verb" },
  { bs: "voljeti", en: "to love / to like", pos: "verb" },
  { bs: "kuća", en: "house", pos: "noun" },
  { bs: "voda", en: "water", pos: "noun" },
  { bs: "vrijeme", en: "time / weather", pos: "noun" },
  { bs: "dan", en: "day", pos: "noun" },
  { bs: "čovjek", en: "person / man", pos: "noun" },
  { bs: "žena", en: "woman", pos: "noun" },
  { bs: "dijete", en: "child", pos: "noun" },
  { bs: "prijatelj", en: "friend", pos: "noun" },
  { bs: "grad", en: "city", pos: "noun" },
  { bs: "život", en: "life", pos: "noun" },
  { bs: "dobro", en: "good / well", pos: "adjective/adverb" },
  { bs: "veliki", en: "big", pos: "adjective" },
  { bs: "mali", en: "small", pos: "adjective" },
  { bs: "novi", en: "new", pos: "adjective" },
  { bs: "mnogo", en: "much / a lot", pos: "adverb" },
];

const STORAGE_KEY = "bosnian-flashcards-progress-v1";
const THEME_KEY = "bosnian-flashcards-theme-v1";

let order = WORDS.map((_, i) => i);
let index = 0;
let flipped = false;
let direction = "bs-en"; // bs-en or en-bs
let mastered = new Set();

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      mastered = new Set(data.mastered || []);
      direction = data.direction || "bs-en";
    }
  } catch (e) { /* ignore corrupt storage */ }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    mastered: Array.from(mastered),
    direction,
  }));
}

function loadTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) { /* ignore */ }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme")
    || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
}

const btnSpeak = document.getElementById("btnSpeak");
let voices = [];

function refreshVoices() {
  voices = ("speechSynthesis" in window) ? window.speechSynthesis.getVoices() : [];
}

function pickVoice() {
  // Bosnian TTS voices are rare; Croatian and Serbian are phonetically
  // close enough to be intelligible, so fall back through them.
  const prefs = ["bs", "hr", "sr"];
  for (const p of prefs) {
    const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith(p));
    if (match) return match;
  }
  return null;
}

function speakWord() {
  const w = currentWordObj();
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(w.bs);
  const voice = pickVoice();
  utter.voice = voice || null;
  utter.lang = voice ? voice.lang : "bs-BA";
  utter.rate = 0.85;
  utter.onstart = () => btnSpeak.classList.add("speaking");
  utter.onend = () => btnSpeak.classList.remove("speaking");
  utter.onerror = () => btnSpeak.classList.remove("speaking");
  window.speechSynthesis.speak(utter);
}

if ("speechSynthesis" in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
  btnSpeak.addEventListener("click", speakWord);
} else {
  btnSpeak.disabled = true;
  btnSpeak.textContent = "🔇";
  btnSpeak.setAttribute("aria-label", "Pronunciation not supported in this browser");
}

const card = document.getElementById("card");
const frontWord = document.getElementById("frontWord");
const frontPos = document.getElementById("frontPos");
const frontLabel = document.getElementById("frontLabel");
const backWord = document.getElementById("backWord");
const backNote = document.getElementById("backNote");
const backLabel = document.getElementById("backLabel");
const cardIndexFront = document.getElementById("cardIndexFront");
const cardIndexBack = document.getElementById("cardIndexBack");
const statPos = document.getElementById("statPos");
const statMastered = document.getElementById("statMastered");
const progressFill = document.getElementById("progressFill");

function currentWordObj() {
  return WORDS[order[index]];
}

function render() {
  const w = currentWordObj();
  const known = mastered.has(order[index]);
  const posText = `No. ${index + 1} of ${WORDS.length}`;

  if (direction === "bs-en") {
    frontLabel.textContent = "Bosnian";
    frontWord.textContent = w.bs;
    backLabel.textContent = "English";
    backWord.textContent = w.en;
  } else {
    frontLabel.textContent = "English";
    frontWord.textContent = w.en;
    backLabel.textContent = "Bosnian";
    backWord.textContent = w.bs;
  }
  frontPos.textContent = w.pos;
  cardIndexFront.textContent = posText;
  cardIndexBack.textContent = posText;
  backNote.textContent = known ? "marked known" : "";

  card.classList.toggle("flipped", flipped);
  card.setAttribute("aria-pressed", String(flipped));
  statPos.textContent = String(index + 1);
  statMastered.textContent = String(mastered.size);
  progressFill.style.width = `${(mastered.size / WORDS.length) * 100}%`;
}

function flip() {
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
  card.setAttribute("aria-pressed", String(flipped));
}

function goNext() {
  flipped = false;
  index = (index + 1) % order.length;
  render();
}

function goPrev() {
  flipped = false;
  index = (index - 1 + order.length) % order.length;
  render();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  index = 0;
  flipped = false;
  render();
}

function markKnown() {
  mastered.add(order[index]);
  saveProgress();
  goNext();
}

function markAgain() {
  mastered.delete(order[index]);
  saveProgress();
  goNext();
}

function switchDirection() {
  direction = direction === "bs-en" ? "en-bs" : "bs-en";
  flipped = false;
  saveProgress();
  render();
}

function resetProgress() {
  if (!confirm("Reset all progress? This clears which words you've marked as known.")) return;
  mastered.clear();
  saveProgress();
  render();
}

card.addEventListener("click", flip);
card.addEventListener("keydown", (e) => {
  if (e.code === "Enter" || e.code === "Space") { e.preventDefault(); flip(); }
});
document.getElementById("btnFlip").addEventListener("click", flip);
document.getElementById("btnNext").addEventListener("click", goNext);
document.getElementById("btnPrev").addEventListener("click", goPrev);
document.getElementById("btnShuffle").addEventListener("click", shuffle);
document.getElementById("btnDirection").addEventListener("click", switchDirection);
document.getElementById("btnRestart").addEventListener("click", resetProgress);
document.getElementById("btnKnow").addEventListener("click", markKnown);
document.getElementById("btnAgain").addEventListener("click", markAgain);
document.getElementById("btnTheme").addEventListener("click", toggleTheme);

document.addEventListener("keydown", (e) => {
  if (document.activeElement === card) return; // card handles its own space/enter
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.code === "ArrowRight") goNext();
  else if (e.code === "ArrowLeft") goPrev();
  else if (e.code === "KeyK") markKnown();
  else if (e.code === "KeyA") markAgain();
  else if (e.code === "KeyP" && "speechSynthesis" in window) speakWord();
});

loadTheme();
loadProgress();
render();
</script>

</body>
</html>
